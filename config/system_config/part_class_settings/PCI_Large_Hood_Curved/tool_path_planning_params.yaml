#################################################################################################################


v2_tpp_variable_pathgap: {
  activate: false,
  target_norm_change: 0.687, # target_surface_normals_change : cos inverse of dot product between consecutive points (degree)
  max_gap: 0.03, # meter (unstable paths more than "continuity_distance") (preferably a multiple of "grid_length_sanding_line")
  min_gap: 0.004, # meter (cannot be less than "grid_length_sanding_line") (preferably a multiple of "grid_length_sanding_line")
}
#################################################################################################################

v2_tpp_contact_analysis: {
  auto_calculate_radius: false, # calculates radius as half the distance between two sanding lines (changes with overlap percentage)
  backing_pad_height: 0.025, # actual pad height = 0.01 m
  force_calc_opposite_cyl_height: 0.1,
  force_calc_radius_step_percent: 10,
  force_calc_angle_step: 10,
  write_all_files: false,
}
#################################################################################################################

v2_boundary_normal_retention: {
  activate: false, # enables retention of boundary surface normals
  boundary_width: 0.035, # meters
  refine_normals_neighbours: 0, # 0 = no refinement

  removeBottomPoints: false,
  reference_pt: [1.02, -0.15, 0.41],
  plusY_angle: 60,
  negY_angle: 60,
}
#################################################################################################################

v2_midpass_SPC_near_boundary: {
  min_sanding_distance: 0.3, # meters
  dist_from_boundary: 0.03, # meters
}
#################################################################################################################

v2_midpass_SPC_anywhere: {
  small_length_to_ignore: 5.0, # meters
  use_paper_across_passes: false,
}
#################################################################################################################

v2_pause_planning: {
  pathgap_entry_exit: 0,
  cnt_entry_exit: 0,
  entry_exit_offset: 0.1,
  retraction_force: -20, # newtons
  distance_to_skip: 0.3, # meters (Skip this distance to allow for planning time)

  boundary_dist_threshold: 0.06, # meters (Condisdered only during profile planning)
  consider_only_connection_pts: true, # bool (Considered only during profile planning)

  instant_pause: false, # false = pause at jumps or boundary
  lookAhead_n_points: 20, # scan n points per loop for instant pausing
  skip_n_pts: 5, # generate a new jump per every n_points
}
#################################################################################################################


# v2_tpp_debug_parameters
v2_tpp_debug_parameters: {
  check_reachability: true, # SAFE = true
  ignore_discontinuity: false, # SAFE = false 
  
  testing_mode: false,
  run_only_segmentation: false,
  
  write_report: true,
  print_debugROS_msgs: false,
  write_debug_files: true,
  write_each_vector_matrix_debug_file: false,
  write_csv: false,
  write_ply: true,
  tcp_ply_axis_num_pts: 5,
  tcp_ply_axis_gap: 0.001,

  ignore_start_end_waypoint_discontinuity: false, # SAFE = false
  ignore_connection_point_reachability: false, # SAFE = false
  ignore_reachability_test: false, # requires advance mode turned on (protected know how)
}
#################################################################################################################



v2_tpp_advanced_planning_params: {
  ######################################
  # Previously v2_tpp_sanding_behaviour:
  turn_off_tool: false, # if true, override all the default tool status to false

  delay_tool_start: 0, # (+ve = delay start by n points, -ve = start n points early) wrt the first touch point
  delay_tool_end: 0, # (+ve = delay stopping by n points, -ve = stop n points early) wrt the last touch point

  tilt_tcp_path_dir: 0, # degrees. Tilt about the axis pointing in the direction of the next point
  tilt_tcp_orth_dir: 0, # degrees. Tilt about the axis orthogonal to the one pointing in the direction of the next point
  tcp_offset: 0.0,
  path_following_tilt: true, 

  do_not_connect_sanding_lines: false,
  shape_following_path: false, # enables centered path following for surface pass
  offset_values_for_shape_following: [-0.02, 0.0, 0.02], # offset distance (in m) from center line for multiple parallel paths
  threshold_for_ignoring_rows: 0.0, # ignore fillpts rows shorter than (threshold * max_row_length) when generating center path
  follow_path_TCP: false,
  entry_exit_inclination_angle_n_pts_avg_dir: 5, # get direction of path by looking at next n points

  ######################################
  # Previously v2_tpp_planning_parameters:
  grid_length_sanding_line_divisor: 5, # The value is (pathgap_sanding_line / divisor)
  grid_length_connection_line_divisor: 5, # The value is (pathgap_connection_line / divisor)

  # If both are true, Priority --> obb_mode > pca_mode
  # For alignment with world axis, obb_mode = false and pca_mode = false
  pca_mode: false, # preference of major axis --> World y axis > World x axis > World z axis (i.e. for hatch angle == zero, Horizontal path)
  obb_mode: true, # optimal bounding box (better alternative for pca_mode)

  state_based_reconstruction: true,
  always_compute_seed_indices: false, # true : traj planner does seed analysis each time
                                      #      : generally will consume (significantly) more time, but fewer (minor difference) jumps.

  retraction_lookAhead_dist: 0.1, # meter

  reorderBtwnSegments: false, # false = sanding one segment at a time

  grid_addition: 0.0, # Default : 0
  pca_similarity_threshold_percent: 85.0, #
  pca_similarity_correction_angle: 45.0, # degree

  separate_by_seed_id: false, # Default: false
  separate_by_tcp_id : false, # Default: false

  outer_boundary_subtraction_x_dir: 0.0,
  outer_boundary_subtraction_y_dir: 0.0,
  ######################################

  # Previously v2_tpp_debug_parameters:
  record_surface_normal_frame: 'tool1',
  override_surface_normals: false,

  tcp_rotation_angle_0: 0.0, # x y plane, z+ surface normal
  tcp_rotation_angle_1: 0.0, # y z plane, x- surface normal
  tcp_rotation_angle_2: -90.0, # x z plane, y- surface normal
  tcp_rotation_angle_3: 0.0, # y z plane, x+ surface normal
  tcp_rotation_angle_4: 0.0, # x z plane, y+ surface normal
  tcp_rotation_angle_5: 0.0, # x y plane, z- surface normal

  #tpp_offset_along_minor_axis: 0.00000000,  #// Deprecated (Controlled from GUI pass setting)

  max_reachability_requests: 36,
  z_height_offset_all_waypoints: 0.0,

  sanity_check_relaxation_factor: 1.5, # multiplier of continuity_dist for sanity check
  skip_n_trajectory_pts: 0, # requires advance mode turned on (protected know how)

  parallel_planning: true,
  max_parallel_astar_requests: 36,

  # shift the input cloud from coordinator
  world_x_offset: 0.0,
  world_y_offset: 0.0,
  world_z_offset: 0.0,
  remove_surface_connection_lines: false

}
