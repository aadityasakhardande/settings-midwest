# All distances in meter
# All angles in degree (unless mentioned specifically)

v2_tpp_sanding_behaviour: {
  turn_on_sander_above_part: false,
  
  outer_boundary_subtraction: 0.00,
  inner_boundary_subtraction: 0.00,

  entry_exit_offset: 0.1, #0.17 (paramter before changing 02/03/26), # 0.05 
  entry_exit_inclination_angle: 0.0, # degrees
}
#################################################################################################################

thin_features_subtraction: {
  activate: false,
  algorithm: 2, 
  # 0 = categorise each point of a segment, 1 = categorise entire segment (Default = 0) ...
  # ... 2 = improved categorisation of each point (0, 1 will be eventually deprecated)

  subtraction_value: 0.0, # meters (valid for all algorithms)

  inner_outer_boundary_cluster_tolerance: 0.01, # meter # to differentiate between inner-outer boundary (valid for all algorithms)
  consider_inside_boundary: true, # to search for disconnected boundary (valid for all algorithms)

  feature_size: 0.01, # Thickness of the thin feature (valid for algorithm = 2)
  preserve_corners: true, # (valid for algorithm = 2)

  search_radius: 0.04, # meters # to search for disconnected boundary (valid for algorithm = 0, 1)
  disconnected_boundary_cluster_tolerance: 0.01, # meters # to cluster disconnected boundary (valid for algorithm = 0, 1)
}

#################################################################################################################

v2_tpp_planning_parameters: {
  pathgap_sanding_line: 0.005, # renamed from pathgap_sanding_line
  pathgap_connection_line: 0.01, # renamed from pathgap_connection_line
  pathgap_entry_exit_line: 0.01, # renamed from pathgap_entry_exit_line

  continuity_distance: 0.05,
  boundary_detection_dist: 0.03,

  cnt_sanding_line: 75,   # between 1-100 (integer)
  cnt_connection_line: 85, # between 1-100 (integer)
  cnt_start_end_line: 90,  # between 1-100 (integer)
  cnt_boundary_sanding_line: 90, # between 1-100 (integer)

  remove_unreachable_pts_radius_multiplier: 0.9, # Default : 0.9

  accceptable_sanding_path_length: 0.2, # meter
  acceptable_dist_2_next_line_percentage: 600, # value = (100 + perc)% of gap between sanding lines

  normal_estimation_radius: 0.01, # renamed from normal_estimation_radius
  z_estimation_radius: 0.02, # renamed from z_estimation_radius
  acceptable_neighbours_in_radius: 7,

  remove_pts_outside_boundary: false,
  feature_radius_boundary_estimation: 0.03, # meters # used for computing boundary during remove_pts_outside_boundary
  path_smoothing_weight: 0.05,
  smoothening_repeat: 0,

  repeat_reachable_pts_analysis: 5,
}
#################################################################################################################


v2_tpp_boundary: {
  offset_to_actual_boundary: 0.005,

  boundary_dist_2_nxt_pt: 0.01,
  boundary_continuity_dist: 0.02,
  min_dist_indv_boundary_pths: 0.40,

  outer_boundary_pass_coordinator_cloud: false,
  outer_boundary_pass_pcl_boundary_radius: 0.015,
  outer_boundary_pass_pcl_boundary_cluster_tol: 0.02,
  outer_boundary_pass_tpp_boundary_search_radius: 0.01,

  clip_boundary_path: false,
  clip_boundary_path_distance: 0.1,

  coordinator_cloud_cluster_tolerance: 0.03, #This will be used to cluster the input merged cloud just in case if there are multiple parts
  allow_inner_boundary_pass_coordinator_cloud: false,
  use_stitched_tpp_input: false
}

#################################################################################################################

v2_customer: {
  # Only parameters from default file in /etc/ss/config/system_config matter
  # 2 stage segmentation can be used along with either of the midPass SPC modes
  two_stage_segmentation: false, # 2 stage segmentation
  midpass_SPC_near_boundary: false, # midpass SPC near boundaries only
  midpass_SPC_anywhere: true, # midpass SPC anywhere on the surface 
  first_pass_type_based_params: true, # (default) false = section_type based, true = pass_type of first pass based
}
#################################################################################################################

v2_tpp_tool_characteristic: {
  tool_contact_width:  0.127, # for orbital sander, diameter
}
#################################################################################################################

v2_tpp_ZigZag_pattern: {
  activate: false,
  amplitude : 0.05,
}
#################################################################################################################

v2_multiTCP: {
  activate: false,

  activate_single_tcp_collision_check: false, # remove points that may be in collision with the coordinator's cloud
                                              # works independently of 'activate'

  collision_radius: 0.06,
  height: 1,
  surface_offset: 0.01,
  use_old: false,
  offset_radius: 0.04,
  trans_shift_angles: [180],
  rot_shift_angles_xAx: [],
  rot_shift_angles_yAx: [],
  rot_shift_angles_zAx: [],

  trans_rot_only: false,
  trans_only: true,
  prefer_trans_only: false,
  separate_mTCP_paths: false,
}

trajectory_planner: {
    ori_options: [false, false, true], # x, y, z
}

