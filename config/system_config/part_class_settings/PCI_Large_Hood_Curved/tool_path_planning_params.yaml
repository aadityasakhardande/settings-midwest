beta_features: { 

  # part class based 
  optimal_path_shift: false, 
  good_major_proportion_start: 0.8, # range = 0 -> 1.0
  good_major_proportion_end: 0.4, # range = 0 -> 1.0

  # part class based 
  correct_obb_edge_case: false, 
  obb_dot_threshold_for_correction: 0.9, # range 0 - 1. Higher the number, more aggressive corrections

  # part class based
  use_roller_for_segment_ordering: false,

  # part class based 
  boundary_pass_away_from_bbox: false,
  distance_from_bbox: 0.02, # points to remove from boundary pass that are within this distance from bounding box
  ignore_dimensions: [false, false, false], # dimension to ignore when finding distance to bbox (x, y, z)

  # part class based
  truncate_sanding_lines: false,



  # part class based 
  augment_surface_normals: false,
  min_length_proportion_percent_of_line: 80,
  keep_lines_at_percent: [0, 45, 100],
}

