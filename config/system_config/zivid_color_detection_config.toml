# Configuration for zivid_color_detection's ColorMaskConfig.
#
# There is no color definition here at all (no HSV thresholds, no RGB tags). Every scan's colors
# are discovered fresh via k-means on that scan's own point colors (MaskUtilities::applyColorClustering):
# every point gets painted with its discovered cluster's centroid color. num_color_clusters below
# is just "how many distinct colors to look for", not a color value itself.
num_color_clusters = 50
kmeans_attempts = 3
kmeans_max_iterations = 75
kmeans_epsilon = 1.0

# Hue is clustered as a circular vector, not a plain number, so it doesn't break at the 0/179
# wraparound and fades out correctly for grey-ish (low-saturation) points. hue_weight scales that
# vector; value_weight scales brightness (V) separately. Raise hue_weight relative to value_weight
# if colors of the same hue but different brightness/shading (e.g. dark vs. bright yellow) are
# landing in different clusters -- that's the default here already, since lighting/shading
# differences usually shouldn't change which color a point is read as.
hue_weight = 0.15
value_weight = 0.05

# Statistical outlier removal
perform_statistical_outlier_removal = false
sor_mean_k = 50
sor_stddev_mul_thresh = 1.0

# Radius outlier removal
perform_radius_outlier_removal = false
radius_outlier_removal_radius = 0.05
radius_outlier_removal_min_neighbors = 5

# Morphological erosion
perform_erosion = false
erosion_radius = 0.01
apply_per_color_erosion = false
