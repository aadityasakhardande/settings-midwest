/**:
  ros__parameters:
    collision_offsets:
      env_collision_offset: 0.03
      self_collision_offset: 0.01
      wp_collision_offset: 0.03
    extender_optimizer:
      change_graduation: 1.0e-06
    joint_optimizer:
      error_equalizer: 1.0e-07
banner_safety_hdlr:
  ros__parameters:
    devices: |
      - name: Light Curtain
        type: 1
        bit: 5
      - name: ESTOP 1
        type: 0
        bit: 6
      - name: ESTOP 2
        type: 0
        bit: 7
      - name: ESTOP Pendant
        type: 0
        bit: 8
    ignore_alert:
    - Light Curtain
fanuc_motion_hdlr:
  ros__parameters:
    override_speed: false
force_module:
  ros__parameters:
    payload: 18.15
jump_node:
  ros__parameters:
    diagnostics: true
    passtopass:
      activate: true
multi_robot_visualization_node:
  ros__parameters:
    flip_orientation: true
reachability_node:
  ros__parameters:
    debug_reachability_output: true
    diagnostics: true
    instance:
      joint_discontinuity_threshold: 0.3
    pct:
      discrete_collision: false
      env_collision_offset: 0.02
      mesh_to_mesh_collision: true
      multiple_threads: true
      wp_collision_offset: 0.005
    search:
      num_threads: 16
      srdf_path: file:///etc/ss/robots/fanuc_m710/robot.srdf
solver_node:
  ros__parameters:
    joint_optimizer:
      ori_options:
      - true
      - false
      - true
    pose_tolerance: 0.02
