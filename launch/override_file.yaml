zivid_camera_hdlr:
  ros__parameters:
    save_raw_scans: true  # Whether to save raw scan data
    downsampling_mode: 2  # 0: Downsample 2x2, 1: Downsample 3x3, 2: Downsample 4x4 
    default_scan_settings_path: ""  # Default path for scan settings YML file: If not set will use scan_settings.yml in package share directory
    use_manual: true
alvium_camera_hdlr:
    ros__parameters:
      interval_ticks: 5000
cognex_camera:
  ros__parameters:
    cognex_ip: "192.168.11.99"
verify_sandpaper:
  ros__parameters:
    paper_json_path: /etc/ss/config/fixed_robot_scripts/chng_sp/Paper.json
    use_cognex: true
