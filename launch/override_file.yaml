# Zivid inspection: shots captured for the SAM3 segmentation review (2026-10-27)
inspection_acquisition:
  ros__parameters:
    device: zivid
    device_type: zivid
    # Capture settings for inspection shots, relative to system_config (or absolute). Empty uses the
    # part class's "path" in part_settings.json, as scans do (capture_settings/ZIVID3_new.yml here).
    # zivid_settings: capture_settings/ZIVID3_new.yml
inspection_handler:
  ros__parameters:
    supported_data_types: ['pointcloud', 'rgb_images']
