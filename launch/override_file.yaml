/**:
  ros__parameters:
    collision_offsets:
      env_collision_offset: 0.04
      self_collision_offset: 0.03
      wp_collision_offset: 0.06
    extender_optimizer:
      change_graduation: 1.0e-06
    joint_optimizer:
      error_equalizer: 1.0e-07
    optimization:
      planning_max_iterations: 2
      planning_max_time: 30.0
    spacing_modifier:
      activate: false
force_module:
  ros__parameters:
    payload: 11.15
jump_node:
  ros__parameters:
    debug_mode: false
    diagnostics: true
    passtopass:
        activate: false
process_handler:
  ros__parameters: {}
reachability_node:
  ros__parameters:
    diagnostics: true
    instance:
      joint_discontinuity_threshold: 0.3
    pct:
      env_collision_offset: 0.02
      mesh_to_mesh_collision: true
      multiple_threads: true
      singularity_tolerance: 0.0001
      wp_collision_offset: 0.02
solver_node:
  ros__parameters:
    discontinuity_threshold: 0.1
    joint_optimizer:
      ori_options:
      - true
      - false
      - true
    pose_tolerance: 0.02
system_readiness_monitor:
